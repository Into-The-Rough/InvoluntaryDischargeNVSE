[Main]

;hold off firing unless the actor that dropped the weapon is fighting
;default: 0
bCombatOnly = 0

;skip the condition and luck roll so every dropped weapon goes off
;also makes actors drop their weapon on death regardless of the engine drop chance
;applies on the next launch
;default: 0
bGuaranteedFire = 0

;upper limit on rounds a single auto-weapon drop can let loose
;the engine caps a magazine at 255, but this key will accept larger values
;default: 8
iBurstCap = 8

;pause in milliseconds inserted between each shot of a burst
;default: 100
iShotSpacingMs = 100

;recoil shove
;each discharge gets a flat push plus an extra amount scaled by the round's weight, aimed away from the gun

;flat push every discharge receives
;default: 85.0
fBaseKick = 85

;push added per unit of weight the chambered round carries
;default: 10.0
fKickPerAmmoWeight = 10

;ignored while bGuaranteedFire is on
;a beaten-up weapon is likelier to fire, a high-Luck dropper makes it less likely, and this key sets how much Luck matters
;default: 1.9
fLuckWeight = 1.9
